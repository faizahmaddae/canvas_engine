name: canvas_engine
description: "Modular Flutter canvas editor engine."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flutter_riverpod: ^3.3.1
  freezed_annotation: ^3.1.0
  intl: any
  json_annotation: ^4.11.0
  uuid: ^4.5.3
  collection: ^1.19.1
  gal: ^2.3.2
  share_plus: ^13.0.0

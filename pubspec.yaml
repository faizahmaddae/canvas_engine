name: canvas_engine
description: "Modular Flutter canvas editor engine."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flutter_riverpod: ^3.3.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  uuid: ^4.5.3
  collection: ^1.19.1
  gal: ^2.3.2
  share_plus: ^13.0.0
  image: ^4.5.4
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  emoji_picker_flutter: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  freezed: ^3.2.5
  json_serializable: ^6.13.1

flutter:
  uses-material-design: true
  fonts:
